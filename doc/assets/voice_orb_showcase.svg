<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="geminiCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="siriCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F43F5E" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="90%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="deepSeekCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#0051FF" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200" />
    <path d="M70,0 V630 M140,0 V630 M210,0 V630 M280,0 V630 M350,0 V630 M420,0 V630 M490,0 V630 M560,0 V630 M630,0 V630 M700,0 V630 M770,0 V630 M840,0 V630 M910,0 V630 M980,0 V630 M1050,0 V630 M1120,0 V630" />
  </g>

  <circle cx="600" cy="315" r="280" fill="#3B82F6" opacity="0.08" />

  <g filter="url(#cardShadow)">
    <rect x="150" y="75" width="900" height="480" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <rect x="150" y="75" width="900" height="480" rx="24" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <text x="190" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" letter-spacing="-0.5">
    ai_voice_orb
  </text>
  <text x="190" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8">
    Fluid Audio-Reactive Neural Voice Visualizer • Gemini Live &amp; Siri Presets • Perlin Surface Noise
  </text>

  <g transform="translate(740, 108)">
    <rect width="130" height="28" rx="14" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#38BDF8">AUDIO REACTIVE</text>
  </g>
  <g transform="translate(885, 108)">
    <rect width="125" height="28" rx="14" fill="#854D0E" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1" />
    <text x="62" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#FCD34D">OKLAB LERP</text>
  </g>

  <!-- Orbs Showcase Simulation -->
  <g transform="translate(240, 240)">
    <!-- Orb 1: Gemini Live (Center main) -->
    <g transform="translate(360, 110)">
      <circle cx="0" cy="0" r="100" fill="url(#geminiCore)" filter="url(#orbGlow)" />
      <!-- Swirling Corona Rays -->
      <circle cx="-20" cy="-15" r="45" fill="#FFFFFF" fill-opacity="0.7" />
      <!-- Constellation Sparks -->
      <circle cx="75" cy="-60" r="3" fill="#E0F2FE" />
      <circle cx="-85" cy="40" r="2.5" fill="#E0F2FE" />
      <circle cx="95" cy="45" r="4" fill="#BAE6FD" />
      <text x="0" y="130" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#38BDF8">Gemini Live</text>
    </g>

    <!-- Orb 2: Siri Horizon (Left) -->
    <g transform="translate(100, 110)">
      <circle cx="0" cy="0" r="75" fill="url(#siriCore)" filter="url(#orbGlow)" />
      <circle cx="-10" cy="-10" r="30" fill="#FFFFFF" fill-opacity="0.6" />
      <text x="0" y="105" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#F43F5E">Siri Horizon</text>
    </g>

    <!-- Orb 3: DeepSeek Neon (Right) -->
    <g transform="translate(620, 110)">
      <circle cx="0" cy="0" r="75" fill="url(#deepSeekCore)" filter="url(#orbGlow)" />
      <circle cx="-10" cy="-10" r="30" fill="#FFFFFF" fill-opacity="0.6" />
      <text x="0" y="105" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#00F0FF">DeepSeek Cyber</text>
    </g>
  </g>
</svg>